name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-bench:
    runs-on: xcode-27
    timeout-minutes: 40
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
      artifact-digest: ${{ steps.packages.outputs.artifact-digest }}
      zip-sha-arm64: ${{ steps.bundle.outputs.zip-sha-arm64 }}
      zip-sha-x86_64: ${{ steps.bundle.outputs.zip-sha-x86_64 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Release tooling and wiki fixtures
        run: scripts/test-release-tools.sh

      - name: Build (universal, release)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Test
        run: python3 -I scripts/check-swift-suite.py

      - name: Benchmark (fails over budget)
        id: benchmark
        run: |
          reports=$(mktemp -d "$RUNNER_TEMP/copia-bench.XXXXXX")
          printf 'reports=%s\n' "$reports" >> "$GITHUB_OUTPUT"
          swift build -c release --product copia-bench
          bin=$(swift build -c release --show-bin-path)
          "$bin/copia-bench" --idle 60 --json "$reports/bench.json"

      # A separate instrumented run explains failures; it never replaces the unprofiled gate above.
      - name: Profile failed benchmark
        if: failure() && steps.benchmark.outcome == 'failure'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          bin=$(swift build -c release --show-bin-path)
          BIN="$bin/copia-bench"
          test -x "$BIN"
          xcrun xctrace record --template 'Time Profiler' --time-limit 100s \
            --output cpu-profile.trace --target-stdout profile-output.log \
            --launch -- "$BIN" --no-sck --idle 60 --opens 1 --json profile-bench.json

      - name: App bundles (unsigned, one per architecture)
        id: bundle
        run: |
          native=$(scripts/prove-package.sh --native-arch); test "$native" = arm64
          scripts/build-app.sh --unsigned
          work="$RUNNER_TEMP/package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'PACKAGES=%s\n' "$work/assets" >> "$GITHUB_ENV"
          scripts/prove-package.sh unsigned "$work"

      # The native Intel job receives exactly these verified bytes, by artifact ID and digest.
      - name: Upload verified unsigned packages
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-packages-${{ github.run_attempt }}
          path: ${{ env.PACKAGES }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload benchmark
        if: always() && steps.benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_attempt }}
          path: ${{ steps.benchmark.outputs.reports }}/bench.json
          if-no-files-found: error

      - name: Upload failure profile
        if: always() && steps.benchmark.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-profile
          path: |
            cpu-profile.trace
            profile-output.log
            profile-bench.json
          if-no-files-found: ignore
          retention-days: 7

  intel:
    needs: build-test-bench
    runs-on: macos-26-intel
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require native Intel on macOS 26
        run: |
          native=$(scripts/prove-package.sh --native-arch); test "$native" = x86_64
          os=$(sw_vers -productVersion); [[ "$os" =~ ^26\.[0-9]+(\.[0-9]+)?$ ]]

      - name: Receive the verified unsigned packages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build-test-bench.outputs.artifact-id }}
          DIGEST: ${{ needs.build-test-bench.outputs.artifact-digest }}
          ARM: ${{ needs.build-test-bench.outputs.zip-sha-arm64 }}
          INTEL: ${{ needs.build-test-bench.outputs.zip-sha-x86_64 }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          version=$(python3 -I scripts/version.py VERSION)
          work=$(mktemp -d "$RUNNER_TEMP/copia-intel.XXXXXX"); mkdir "$work/download"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$work/download/transport.zip"
          python3 -I scripts/release-assets.py receive "$work/download/transport.zip" "$DIGEST" "$ARM" "$INTEL" "$version" "$work/assets"
          printf 'WORK=%s\n' "$work" >> "$GITHUB_ENV"

      - name: Native Intel packaged self-test
        run: scripts/prove-package.sh unsigned "$WORK/proof" "$WORK/assets"
