name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-bench:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Release tooling and wiki fixtures
        run: scripts/test-release-tools.sh

      - name: Build (universal, release)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Test
        run: python3 -I scripts/check-swift-suite.py

      - name: Benchmark (fails over budget)
        id: benchmark
        run: |
          reports=$(mktemp -d "$RUNNER_TEMP/copia-bench.XXXXXX")
          printf 'reports=%s\n' "$reports" >> "$GITHUB_OUTPUT"
          swift build -c release --product copia-bench
          bin=$(swift build -c release --show-bin-path)
          "$bin/copia-bench" --idle 60 --json "$reports/bench.json"

      # A separate instrumented run explains failures; it never replaces the unprofiled gate above.
      - name: Profile failed benchmark
        if: failure() && steps.benchmark.outcome == 'failure'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          bin=$(swift build -c release --show-bin-path)
          BIN="$bin/copia-bench"
          test -x "$BIN"
          xcrun xctrace record --template 'Time Profiler' --time-limit 100s \
            --output cpu-profile.trace --target-stdout profile-output.log \
            --launch -- "$BIN" --no-sck --idle 60 --opens 1 --json profile-bench.json

      - name: App bundle (unsigned)
        run: |
          scripts/build-app.sh --unsigned
          scripts/prove-package.sh unsigned "$RUNNER_TEMP/package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload benchmark
        if: always() && steps.benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_attempt }}
          path: ${{ steps.benchmark.outputs.reports }}/bench.json
          if-no-files-found: error

      - name: Upload failure profile
        if: always() && steps.benchmark.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-profile
          path: |
            cpu-profile.trace
            profile-output.log
            profile-bench.json
          if-no-files-found: ignore
          retention-days: 7
