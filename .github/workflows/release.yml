name: Release

# Pushing a tag such as v0.0.1 builds the universal app, signs it, and publishes it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 40
    # Signing secrets live in this environment, which only v* tags may use.
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Signing keychain
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: scripts/ci-keychain.sh

      - name: Build and sign
        run: |
          export COPIA_VERSION="${GITHUB_REF_NAME#v}" COPIA_TIMESTAMP=1
          scripts/build-app.sh
          codesign --verify --deep --strict --verbose=2 dist/Copia.app
          codesign -dvv dist/Copia.app 2>&1 | grep -E '^(Identifier|TeamIdentifier|Timestamp|Authority=Apple Development)' | sed -E 's/^(Authority=Apple Development).*/\1/'
          lipo -archs dist/Copia.app/Contents/MacOS/Copia | grep -q 'x86_64 arm64'
          spctl -a -vv dist/Copia.app 2>&1 || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/Copia-$VERSION.zip"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Download \`Copia-$VERSION.zip\`, unzip it and move \`Copia.app\` to \`/Applications\`.

          This build is signed but not notarized. On first launch macOS blocks it: open **System Settings → Privacy & Security** and click **Open Anyway** next to the message about Copia.

          Requires macOS 27.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --verify-tag --title "Copia $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/copia-signing.p12"
